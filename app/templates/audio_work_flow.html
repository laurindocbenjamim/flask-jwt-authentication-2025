<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Workflow UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Workflow Editor</a>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <!-- Sidebar/Palette -->
            <div class="col-lg-3 col-md-4" id="palette">
                <h5>Tools</h5>
                <button class="btn btn-primary w-100 mb-3" data-bs-toggle="modal" data-bs-target="#videoUploadModal">
                    <i class="fas fa-video"></i> Upload Video
                </button>
                <div class="draggable-source-item card mb-3" draggable="true" id="textBoxSource">
                    <div class="card-body text-center">
                        <i class="fas fa-comment-dots fa-2x"></i>
                        <p class="mb-0 mt-1">Drag Text Box</p>
                    </div>
                </div>
                <hr>
                <div id="video-info-area" class="mt-3 p-3 border rounded d-none">
                    <h6>Uploaded Video:</h6>
                    <p id="video-filename"></p>
                    <div id="video-preview-placeholder" class="bg-light text-center p-5">
                        <i class="fas fa-film fa-3x text-muted"></i>
                    </div>
                </div>
            </div>

            <!-- Workflow Canvas -->
            <div class="col-lg-9 col-md-8">
                <h5 class="mb-3">Workflow Canvas</h5>
                <div id="workflow-canvas" class="border rounded p-3 position-relative" style="min-height: 600px; background-color: #f8f9fa;">
                    <!-- SVG layer for connections -->
                    <svg id="connections-svg" class="position-absolute top-0 start-0 w-100 h-100" style="pointer-events: none; z-index: 0;"></svg>
                    <!-- Text boxes will be dropped here -->
                    <div class="canvas-instructions text-muted text-center position-absolute top-50 start-50 translate-middle">
                        Drag text boxes here
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Video Upload Modal -->
    <div class="modal fade" id="videoUploadModal" tabindex="-1" aria-labelledby="videoUploadModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="videoUploadModalLabel">Upload Video</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Select a video file to add to your workflow.</p>
                    <div id="drop-zone" class="drop-zone-area p-5 border-dashed text-center mb-3">
                        Drag & Drop video here or click to select
                    </div>
                    <input type="file" id="videoFile" accept="video/*" class="form-control d-none">
                    <div id="upload-progress-container" class="progress mt-3 d-none">
                        <div id="upload-progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                    </div>
                    <div id="upload-status" class="mt-2"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="confirmUploadBtn" disabled>Confirm Upload</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/uuid@latest/dist/umd/uuidv4.min.js"></script> <!-- For unique IDs -->
    <script src="script.js"></script>
</body>
</html>
