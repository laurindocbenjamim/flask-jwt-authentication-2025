<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Downloader</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --light-color: #f8f9fa;
            --dark-color: #212529;
        }

        body {
            background-color: #f5f7fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            border: none;
            overflow: hidden;
        }

        .card-header {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            padding: 1.5rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
        }

        .btn-outline-primary {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .btn-outline-primary:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .progress {
            height: 10px;
            border-radius: 5px;
        }

        .progress-bar {
            background-color: var(--accent-color);
        }

        .thumbnail {
            border-radius: 10px;
            object-fit: cover;
            height: 120px;
            width: 100%;
        }

        .loading-spinner {
            display: none;
        }

        #errorAlert {
            display: none;
        }

        .download-btn-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        #realProgressContainer {
            display: none;
        }

        /* Add these new styles */
        .transcript-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .transcript-editor {
            min-height: 200px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            background-color: #f8f9fa;
            white-space: pre-wrap;
        }

        .copy-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            cursor: pointer;
            font-size: 1.2rem;
        }

        .progress-text {
            margin-left: 10px;
            font-size: 0.9rem;
            color: var(--dark-color);
        }

        #percentageDisplay {
            font-weight: bold;
            color: var(--primary-color);
        }
    </style>
</head>

<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header text-center">
                        <h2><i class="bi bi-youtube me-2"></i> YouTube Video Downloader</h2>
                        <p class="mb-0">Download videos with audio extraction and transcription</p>
                    </div>
                    <div class="card-body p-4">
                        <!-- Error Alert -->
                        <div id="errorAlert" class="alert alert-danger alert-dismissible fade show">
                            <span id="errorMessage"></span>
                            <button type="button" class="btn-close" onclick="hideError()"></button>
                        </div>

                        <!-- Main Form -->
                        <form id="downloadForm">
                            <div class="mb-3">
                                <label for="videoUrl" class="form-label">YouTube URL</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-link-45deg"></i></span>
                                    <input type="url" class="form-control" id="videoUrl"
                                        placeholder="https://www.youtube.com/watch?v=..." required>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Format</label>
                                    <div class="btn-group w-100" role="group">
                                        <input type="radio" class="btn-check" name="format" id="formatMp4" value="mp4"
                                            autocomplete="off" checked>
                                        <label class="btn btn-outline-primary" for="formatMp4"><i
                                                class="bi bi-film me-1"></i> MP4</label>

                                        <input type="radio" class="btn-check" name="format" id="formatMp3" value="mp3"
                                            autocomplete="off">
                                        <label class="btn btn-outline-primary" for="formatMp3"><i
                                                class="bi bi-music-note me-1"></i> MP3</label>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Options</label>
                                    <div class="d-flex flex-column">
                                        <div class="form-check form-switch mb-2">
                                            <input class="form-check-input" type="checkbox" id="extractAudio">
                                            <label class="form-check-label" for="extractAudio">Extract Audio</label>
                                        </div>
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="speechToText">
                                            <label class="form-check-label" for="speechToText">Speech to Text</label>
                                        </div>
                                    </div>
                                </div>
                            </div>



                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <span id="submitText">Download Now</span>
                                    <!-- Updated Loading Spinner -->
                                    <span class="d-flex align-items-center mt-2">
                                        <span id="loadingSpinner"
                                            class="spinner-border spinner-border-sm loading-spinner"></span>
                                        <span class="progress-text">Processing: <span id="percentageDisplay"
                                                class="text-white">0</span>%</span>
                                    </span>
                                </button>

                            </div>
                        </form>

                        <!-- Real Progress Bar -->
                        <div id="realProgressContainer" class="mt-3">
                            <div class="progress">
                                <div id="realProgressBar"
                                    class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar"
                                    style="width: 0%"></div>
                            </div>
                            <div class="progress-details mt-2 small text-muted">
                                <span id="downloadSpeed"></span> |
                                <span id="downloadSize"></span> |
                                ETA: <span id="downloadEta"></span>
                            </div>
                        </div>

                        <!-- Authentication Required -->
                        <div id="authContainer" class="text-center mt-3" style="display: none;">
                            <div class="alert alert-warning">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                YouTube requires authentication
                            </div>
                            <div class="cookie-upload" id="cookieDropArea">
                                <h5><i class="bi bi-file-earmark-lock"></i> Upload YouTube Cookies</h5>
                                <p class="small text-muted">
                                    Export cookies using <a
                                        href="https://chrome.google.com/webstore/detail/get-cookiestxt/bgaddhkoddajcdgocldbbfleckgcbcid"
                                        target="_blank">Get cookies.txt</a>
                                </p>
                                <input type="file" id="cookieFileInput" class="d-none" accept=".txt">
                                <button class="btn btn-outline-primary mt-2" id="selectCookieFile">
                                    <i class="bi bi-upload me-1"></i>Select cookies.txt
                                </button>
                            </div>
                            <button class="btn btn-primary mt-3" id="retryDownload">
                                <i class="bi bi-arrow-clockwise me-1"></i>Retry Download
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Results Section -->
                <div class="card mt-4" id="resultSection" style="display: none;">
                    <div class="card-body">
                        <h4 class="card-title"><i class="bi bi-download me-2"></i>Downloads Ready</h4>

                        <div class="row mt-3">
                            <div class="col-md-4">
                                <img src="" class="thumbnail mb-3" id="resultThumbnail" alt="Video thumbnail">
                            </div>
                            <div class="col-md-8">
                                <h5 id="resultTitle"></h5>
                                <p class="text-muted" id="resultMeta"></p>

                                <div class="download-btn-container" id="downloadButtons"></div>

                                <!-- Updated Transcript Container -->
                                <div id="transcriptContainer" class="mt-4" style="display: none;">
                                    <div class="transcript-header">
                                        <h5><i class="bi bi-text-paragraph me-2"></i>Transcript</h5>
                                        <button class="copy-btn" id="copyTranscriptBtn" title="Copy to clipboard">
                                            <i class="bi bi-clipboard"></i>
                                        </button>
                                    </div>
                                    <div id="transcriptText" class="transcript-editor" contenteditable="true"></div>
                                </div>


                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const serverDomain = 'http://localhost:5000';


            // Elements
            const form = document.getElementById('downloadForm');
            const resultSection = document.getElementById('resultSection');
            const errorAlert = document.getElementById('errorAlert');
            const errorMessage = document.getElementById('errorMessage');

            // Error handling
            window.showError = function (message) {
                errorMessage.textContent = message;
                errorAlert.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            window.hideError = function () {
                errorAlert.style.display = 'none';
            };

            // Format duration
            function formatDuration(seconds) {
                if (!seconds) return '';
                const hours = Math.floor(seconds / 3600);
                const minutes = Math.floor((seconds % 3600) / 60);
                const secs = seconds % 60;
                let result = '';
                if (hours > 0) result += `${hours}h `;
                if (minutes > 0 || hours > 0) result += `${minutes}m `;
                result += `${secs}s`;
                return result.trim();
            }

            // Setup cookie upload
            function setupCookieUpload(userId) {
                const cookieDropArea = document.getElementById('cookieDropArea');
                const cookieFileInput = document.getElementById('cookieFileInput');
                const selectCookieFile = document.getElementById('selectCookieFile');
                const retryDownload = document.getElementById('retryDownload');

                // Handle file selection
                selectCookieFile.addEventListener('click', () => cookieFileInput.click());

                cookieFileInput.addEventListener('change', async (e) => {
                    if (e.target.files.length > 0) {
                        await uploadCookies(e.target.files[0], userId);
                    }
                });

                // Handle drag and drop
                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                    cookieDropArea.addEventListener(eventName, preventDefaults, false);
                });

                function preventDefaults(e) {
                    e.preventDefault();
                    e.stopPropagation();
                }

                function highlight() {
                    cookieDropArea.classList.add('bg-light');
                }

                function unhighlight() {
                    cookieDropArea.classList.remove('bg-light');
                }

                ['dragenter', 'dragover'].forEach(eventName => {
                    cookieDropArea.addEventListener(eventName, highlight, false);
                });

                ['dragleave', 'drop'].forEach(eventName => {
                    cookieDropArea.addEventListener(eventName, unhighlight, false);
                });

                cookieDropArea.addEventListener('drop', async (e) => {
                    const dt = e.dataTransfer;
                    const file = dt.files[0];
                    if (file && file.name.endsWith('.txt')) {
                        await uploadCookies(file, userId);
                    }
                });

                retryDownload.addEventListener('click', () => {
                    document.getElementById('authContainer').style.display = 'none';
                    downloadVideo();
                });
            }

            // Upload cookies
            async function uploadCookies(file, userId) {
                const formData = new FormData();
                formData.append('cookies_file', file);
                formData.append('user_id', userId);

                try {
                    const response = await fetch(`${serverDomain}/api/v1/video/download`, {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    if (!response.ok) throw new Error(data.error || 'Failed to upload cookies');

                    alert('Cookies uploaded successfully! Click "Retry Download" to continue.');
                } catch (error) {
                    showError(error.message);
                }
            }

            // Add download button
            function addDownloadButton(type, filename, size) {
                const btn = document.createElement('a');
                btn.href = `${serverDomain}/api/v1/video/download/${encodeURIComponent(filename)}`;
                btn.className = 'btn btn-outline-primary';
                btn.innerHTML = `<i class="bi bi-download me-1"></i> ${type} (${size})`;
                btn.download = filename;
                btn.target = '_blank';
                document.getElementById('downloadButtons').appendChild(btn);
            }

            function showAuthRequired(solution) {
                const authContainer = document.getElementById('authContainer');
                authContainer.innerHTML = `
        <div class="alert alert-warning">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            ${solution.description}
        </div>
        <a href="${solution.instructions_url}" target="_blank" class="btn btn-outline-primary">
            <i class="bi bi-book me-1"></i> View Instructions
        </a>
        <!-- Your existing cookie upload UI -->
    `;
                authContainer.style.display = 'block';
            }

            // Main download function
            async function downloadVideo() {
                const url = document.getElementById('videoUrl').value;
                const format = document.querySelector('input[name="format"]:checked').value;
                const extractAudio = document.getElementById('extractAudio').checked;
                const speechToText = document.getElementById('speechToText').checked;
                const userId = 'user_' + Math.random().toString(36).substr(2, 9);

                // Reset UI
                hideError();
                document.getElementById('loadingSpinner').style.display = 'inline-block';
                document.getElementById('submitText').textContent = 'Processing...';
                document.getElementById('authContainer').style.display = 'none';
                document.getElementById('resultSection').style.display = 'none';
                document.getElementById('downloadButtons').innerHTML = '';

                try {
                    const response = await fetch(`${serverDomain}/api/v1/video/download`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            url: url,
                            format: format,
                            extract_audio: extractAudio,
                            speech_to_text: speechToText,
                            user_id: userId
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        if (data.auth_required) {
                            // Show cookie upload UI
                            showAuthRequired(data.solution);

                            setupCookieUpload(userId);
                            document.getElementById('authContainer').style.display = 'block';
                            throw new Error('Authentication required');
                        }
                        throw new Error(data.error || 'Download failed');
                    }

                    // Show results
                    document.getElementById('resultTitle').textContent = data.title;
                    document.getElementById('resultMeta').textContent = `${formatDuration(data.duration)} • ${data.size_mb || data.video_size_mb}MB`;
                    document.getElementById('resultThumbnail').src = data.thumbnail || '';

                    if (data.video_file) {
                        addDownloadButton('Video', data.video_file, data.video_size_mb + 'MB');
                    }
                    if (data.audio_file) {
                        addDownloadButton('Audio', data.audio_file, data.audio_size_mb + 'MB');
                    }
                    if (data.transcript_file) {
                        addDownloadButton('Transcript', data.transcript_file, (data.transcript_size / 1024).toFixed(2) + 'KB');
                        document.getElementById('transcriptText').textContent = data.transcript;
                        document.getElementById('transcriptContainer').style.display = 'block';
                    }

                    resultSection.style.display = 'block';

                } catch (error) {
                    showError(error.message);
                } finally {
                    document.getElementById('loadingSpinner').style.display = 'none';
                    document.getElementById('submitText').textContent = 'Download Now';
                }
            }

            // Form submission
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                downloadVideo();
            });

            // Toggle audio extraction based on format selection
            document.querySelectorAll('input[name="format"]').forEach(radio => {
                radio.addEventListener('change', function () {
                    const extractAudioCheckbox = document.getElementById('extractAudio');
                    if (this.value === 'mp3') {
                        extractAudioCheckbox.checked = true;
                        extractAudioCheckbox.disabled = true;
                    } else {
                        extractAudioCheckbox.disabled = false;
                    }
                });
            });
        });
    </script>
</body>

</html>
